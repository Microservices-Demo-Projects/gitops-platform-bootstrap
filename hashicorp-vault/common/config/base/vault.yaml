# system:auth-delegator lets Vault's kubernetes auth method call TokenReview.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: ClusterRole
  name: system:auth-delegator
  apiGroup: rbac.authorization.k8s.io
---
# The Vault pod (not the operator) reads/writes vault-unseal-keys itself, and the
# operator's own ClusterRole doesn't cover that.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault
  namespace: vault
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault
  namespace: vault
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
roleRef:
  kind: Role
  name: vault
  apiGroup: rbac.authorization.k8s.io
---
# Reconciled by the bank-vaults vault-operator into a StatefulSet plus fully
# automated init and unseal. See ../../../README.md#notes
apiVersion: vault.banzaicloud.com/v1alpha1
kind: Vault
metadata:
  name: vault
  namespace: vault
spec:
  size: 3

  # Fully qualified on purpose: a bare "hashicorp/vault" resolves to a Red Hat
  # short-name alias on RHEL/CRC nodes that has no 2.0.4 tag.
  image: docker.io/hashicorp/vault:2.0.4
  bankVaultsImage: ghcr.io/bank-vaults/bank-vaults:v1.33.1

  serviceAccount: vault
  serviceType: ClusterIP

  existingTlsSecretName: vault-tls

  # Namespaces that need the CA bundle to validate Vault's server certificate.
  caNamespaces:
    - external-secrets

  unsealConfig:
    kubernetes:
      secretNamespace: vault
      secretName: vault-unseal-keys

  volumeClaimTemplates:
    - metadata:
        name: vault-raft
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi

  volumeMounts:
    - name: vault-raft
      mountPath: /vault/file

  config:
    disable_mlock: true
    storage:
      raft:
        path: /vault/file
    listener:
      tcp:
        address: "0.0.0.0:8200"
        tls_cert_file: /vault/tls/server.crt
        tls_key_file: /vault/tls/server.key
        tls_min_version: "tls13"
    api_addr: "https://vault.vault.svc.cluster.local:8200"
    cluster_addr: "https://${.Env.POD_NAME}:8201"
    ui: true

  # Applied by the bank-vaults sidecar once Vault is unsealed.
  externalConfig:
    policies:
      - name: external-secrets-readonly-policy
        rules: |
          path "kv/*" {
            capabilities = ["read", "list"]
          }
          path "database/creds/*" {
            capabilities = ["read", "list"]
          }

    auth:
      - type: kubernetes
        roles:
          - name: external-secrets
            bound_service_account_names: ["external-secrets"]
            bound_service_account_namespaces: ["external-secrets"]
            policies: ["external-secrets-readonly-policy"]
            ttl: 1h

    secrets:
      - path: kv
        type: kv
        description: General-purpose secrets for the platform.
        options:
          version: 2

      - path: database
        type: database
        description: Dynamic, rotating PostgreSQL credentials.
        configuration:
          config:
            - name: pocdb
              plugin_name: postgresql-database-plugin
              allowed_roles: ["app-ro", "app-rw", "app-setup"]
              # mTLS only, no password: postgres's pg_hba requires it of `vault`.
              connection_url: "postgresql://postgres-rw.postgres.svc.cluster.local:5432/pocdb?sslmode=verify-full&sslrootcert=/vault/tls/ca.crt&sslcert=/vault/tls/server.crt&sslkey=/vault/tls/server.key"
              # Must stay false - postgres doesn't exist yet at wave 40.
              verify_connection: false
          roles:
            - name: app-ro
              db_name: pocdb
              creation_statements: |
                CREATE ROLE "vlt_app_ro_{{name}}"
                WITH LOGIN PASSWORD '{{password}}'
                VALID UNTIL '{{expiration}}';
                GRANT app_ro TO "vlt_app_ro_{{name}}";
              default_ttl: "1h"
              max_ttl: "24h"
            - name: app-rw
              db_name: pocdb
              creation_statements: |
                CREATE ROLE "vlt_app_rw_{{name}}"
                WITH LOGIN PASSWORD '{{password}}'
                VALID UNTIL '{{expiration}}';
                GRANT app_rw TO "vlt_app_rw_{{name}}";
              default_ttl: "1h"
              max_ttl: "24h"
            - name: app-setup
              db_name: pocdb
              creation_statements: |
                CREATE ROLE "vlt_setup_{{name}}"
                WITH LOGIN PASSWORD '{{password}}'
                VALID UNTIL '{{expiration}}';
                GRANT ALL PRIVILEGES ON DATABASE pocdb TO "vlt_setup_{{name}}";
              default_ttl: "1h"
              max_ttl: "24h"
