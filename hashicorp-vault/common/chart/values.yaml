vault-operator:
  replicaCount: 1

  crds:
    install: true

  image:
    repository: ghcr.io/bank-vaults/vault-operator
    pullPolicy: IfNotPresent

  bankVaults:
    image:
      repository: ghcr.io/bank-vaults/bank-vaults
      tag: "v1.33.1"

  watchNamespace: ""

  resources:
    limits:
      cpu: 100m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
