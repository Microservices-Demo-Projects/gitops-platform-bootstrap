apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-smoke-test
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vault-smoke-test
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["vault-unseal-keys"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vault-smoke-test
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: vault-smoke-test
    namespace: vault
roleRef:
  kind: Role
  name: vault-smoke-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-smoke-test
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: vault-smoke-test
    spec:
      serviceAccountName: vault-smoke-test
      restartPolicy: Never
      volumes:
        - name: vault-ca
          secret:
            secretName: vault-tls
            items:
              - key: ca.crt
                path: ca.crt
      containers:
        - name: smoke-test
          image: docker.io/hashicorp/vault:2.0.4
          env:
            - name: VAULT_ADDR
              value: "https://vault.vault.svc.cluster.local:8200"
            - name: VAULT_CACERT
              value: /vault/tls/ca.crt
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-unseal-keys
                  key: vault-root
          volumeMounts:
            - name: vault-ca
              mountPath: /vault/tls
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              KV_PATH="kv/smoke-test"
              EXPECTED="ok"

              echo "Writing $KV_PATH..."
              retry vault kv put "$KV_PATH" value="$EXPECTED"

              echo "Reading $KV_PATH..."
              ACTUAL=$(vault kv get -field=value "$KV_PATH")

              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "smoke-test succeeded: got expected value '$ACTUAL'"
                vault kv delete "$KV_PATH"
                exit 0
              else
                echo "smoke-test FAILED: expected '$EXPECTED', got '$ACTUAL'"
                echo "Leaving kv/smoke-test in place for debugging."
                exit 1
              fi
