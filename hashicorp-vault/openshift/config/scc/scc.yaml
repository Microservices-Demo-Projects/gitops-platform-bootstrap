# restricted-v2 verbatim, plus the two capabilities the vault-operator hardcodes
# onto the Vault container. Why it can't be avoided: ../../README.md#ipc_lock-and-setfcap
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: vault-ipc-lock
  annotations:
    kubernetes.io/description: >-
      restricted-v2 plus the IPC_LOCK and SETFCAP capabilities the
      bank-vaults vault-operator hardcodes onto the Vault container. Bound
      only to the `vault` ServiceAccount in the `vault` namespace.
# Listing a capability here only allows a container to request it; ALL is still dropped.
allowedCapabilities:
  - IPC_LOCK
  - SETFCAP
  - NET_BIND_SERVICE
requiredDropCapabilities:
  - ALL
defaultAddCapabilities: null

allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegeEscalation: false
allowPrivilegedContainer: false
readOnlyRootFilesystem: false
runAsUser:
  type: MustRunAsRange
fsGroup:
  type: MustRunAs
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: RunAsAny
seccompProfiles:
  - runtime/default
volumes:
  - configMap
  - csi
  - downwardAPI
  - emptyDir
  - ephemeral
  - persistentVolumeClaim
  - projected
  - secret

# Empty on purpose - access comes from the RoleBinding in rbac.yaml.
users: []
groups: []
