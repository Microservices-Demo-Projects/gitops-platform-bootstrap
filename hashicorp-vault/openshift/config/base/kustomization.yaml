# The shared Vault CR and RBAC, plus two patches for OpenShift's dynamically
# assigned UID. common/ is deliberately left untouched.
resources:
  - ../../../common/config/base

patches:
  # Lets the SCC assign the security context. See ../../README.md#the-pods-uid-and-fsgroup
  - target:
      kind: Vault
      name: vault
    patch: |-
      - op: add
        path: /spec/platformManagedSecurityContext
        value: true

  # libpq can't infer the username here. See ../../README.md#the-database-connection-needs-an-explicit-username
  - target:
      kind: Vault
      name: vault
    patch: |-
      - op: replace
        path: /spec/externalConfig/secrets/1/configuration/config/0/connection_url
        value: postgresql://postgres-rw.postgres.svc.cluster.local:5432/pocdb?user=vault&sslmode=verify-full&sslrootcert=/vault/tls/ca.crt&sslcert=/vault/tls/server.crt&sslkey=/vault/tls/server.key
