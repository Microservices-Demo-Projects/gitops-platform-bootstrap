# 2 replicas and a PDB, unlike the single-node OpenShift demo cluster.
# enableHA turns on leader election so only one replica is ever active.
stakater-reloader:
  reloader:
    isOpenshift: false
    enableHA: true

    deployment:
      replicas: 2
      securityContext:
        runAsUser: 65534 # nobody

    podDisruptionBudget:
      enabled: true
      minAvailable: 1
