# The subchart pins runAsUser: 65534, which restricted-v2 rejects; null deletes
# the key so the platform assigns a UID. Has to be an ArgoCD valueFiles overlay
# rather than a chart default. See ./README.md#notes
stakater-reloader:
  reloader:
    isOpenshift: true

    deployment:
      securityContext:
        runAsUser: null
