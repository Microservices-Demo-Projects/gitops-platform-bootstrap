# Health checks ArgoCD lacks by default: a child Application is only Healthy when
# Synced+Healthy, and a Vault CR only once its raft cluster has elected a leader.
# Patched into the ArgoCD CR (the operator-supported route to argocd-cm) with
# ServerSideApply so this owns only resourceHealthChecks. See ../../README.md#the-two-health-checks-in-wave-0
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Delete=false,Prune=false
spec:
  resourceHealthChecks:
    - group: argoproj.io
      kind: Application
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for the child app to be Synced and Healthy"

        if obj.status ~= nil then
          -- A failed sync (e.g. a PostSync smoke test) still leaves sync=Synced and
          -- health=Healthy behind, so check the operation too.
          local op = obj.status.operationState
          if op ~= nil and (op.phase == "Failed" or op.phase == "Error") then
            hs.status = "Degraded"
            hs.message = op.message or ("last sync " .. op.phase)
            return hs
          end

          if obj.status.health ~= nil and obj.status.sync ~= nil then
            if obj.status.health.status == "Degraded" then
              hs.status = "Degraded"
              hs.message = obj.status.health.message or "child app is Degraded"
            elseif obj.status.sync.status == "Synced" and obj.status.health.status == "Healthy" then
              hs.status = "Healthy"
              hs.message = "child app is Synced and Healthy"
            end
          end
        end

        return hs
    - group: vault.banzaicloud.com
      kind: Vault
      check: |
        hs = {}
        hs.status = "Progressing"
        hs.message = "Waiting for the Vault raft cluster to elect a leader"
        if obj.status ~= nil then
          for i, condition in ipairs(obj.status.conditions or {}) do
            if condition.type == "Failed" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = condition.message or condition.error or "Vault reconciliation failed"
              return hs
            end
          end
          if obj.status.leader ~= nil and obj.status.leader ~= "" then
            hs.status = "Healthy"
            hs.message = "Vault raft cluster has a leader: " .. obj.status.leader
            return hs
          end
        end
        return hs
