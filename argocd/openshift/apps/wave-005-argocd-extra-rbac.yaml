# Cluster-scoped grants the openshift-gitops application-controller lacks out of
# the box. No Kubernetes equivalent - its argocd-server role is already broad.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-app-controller-extra
  annotations:
    argocd.argoproj.io/sync-wave: "5"
rules:
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - "*"
  - apiGroups:
      - cert-manager.io
    resources:
      - clusterissuers
    verbs:
      - "*"
  - apiGroups:
      - external-secrets.io
    resources:
      - clustersecretstores
    verbs:
      - "*"
  - apiGroups:
      - admissionregistration.k8s.io
    resources:
      - validatingwebhookconfigurations
      - mutatingwebhookconfigurations
    verbs:
      - "*"
  - apiGroups:
      - security.openshift.io
    resources:
      - securitycontextconstraints
    verbs:
      - "*"
  - apiGroups:
      - vault.banzaicloud.com
    resources:
      - vaults
    verbs:
      - "*"
  - apiGroups:
      - operator.external-secrets.io
    resources:
      - operatorconfigs
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-app-controller-extra
  annotations:
    argocd.argoproj.io/sync-wave: "5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-app-controller-extra
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
