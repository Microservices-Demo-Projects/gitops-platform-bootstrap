# Installs the Helm chart rather than the OLM operator, whose image is amd64-only.
# See ../../../external-secrets/openshift/README.md#notes
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: openshift-gitops
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "30"
spec:
  project: platform
  sources:
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: external-secrets/common/chart
      helm:
        valueFiles:
          - $values/external-secrets/openshift/values.yaml
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      ref: values
      path: external-secrets/openshift
    - repoURL: https://github.com/Microservices-Demo-Projects/gitops-platform-bootstrap.git
      targetRevision: feature/argocd-gitops-bootstrap
      path: external-secrets/openshift/config/namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: "10s"
        factor: 2
        maxDuration: "3m"
