apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-smoke-test
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: external-secrets-smoke-test
    namespace: external-secrets
roleRef:
  kind: ClusterRole
  name: external-secrets-smoke-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-smoke-test-vault-exec
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["vault-unseal-keys"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-smoke-test-vault-exec
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: external-secrets-smoke-test
    namespace: external-secrets
roleRef:
  kind: Role
  name: external-secrets-smoke-test-vault-exec
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: external-secrets-smoke-test
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: external-secrets-smoke-test
    spec:
      serviceAccountName: external-secrets-smoke-test
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              NS=test-eso
              VAULT_NS=vault
              VAULT_POD=vault-0
              KV_PATH=kv/eso-smoke-test
              EXPECTED=smoke-test-ok

              cleanup_ok() {
                echo "Cleaning up test resources"
                kubectl delete externalsecret smoke-test -n "$NS" --ignore-not-found
                kubectl delete namespace "$NS" --ignore-not-found --wait=false
                kubectl exec -n "$VAULT_NS" "$VAULT_POD" -- env VAULT_SKIP_VERIFY=true VAULT_TOKEN="$VAULT_TOKEN" vault kv delete "$KV_PATH" || true
              }

              kubectl create namespace "$NS" --dry-run=client -o yaml | kubectl apply -f -

              retry kubectl get secret vault-unseal-keys -n "$VAULT_NS"
              VAULT_TOKEN=$(kubectl get secret vault-unseal-keys -n "$VAULT_NS" -o jsonpath='{.data.vault-root}' | base64 -d)

              kubectl exec -n "$VAULT_NS" "$VAULT_POD" -- env VAULT_SKIP_VERIFY=true VAULT_TOKEN="$VAULT_TOKEN" vault kv put "$KV_PATH" value="$EXPECTED"

              cat <<EOF | kubectl apply -f -
              apiVersion: external-secrets.io/v1
              kind: ExternalSecret
              metadata:
                name: smoke-test
                namespace: $NS
              spec:
                refreshInterval: 15s
                secretStoreRef:
                  name: local-vault-backend
                  kind: ClusterSecretStore
                target:
                  name: smoke-test-secret
                  creationPolicy: Owner
                data:
                - secretKey: value
                  remoteRef:
                    key: $KV_PATH
                    property: value
              EOF

              synced() {
                [ "$(kubectl get secret smoke-test-secret -n "$NS" \
                  -o go-template='{{ index .data "value" | base64decode }}' 2>/dev/null)" = "$EXPECTED" ]
              }
              retry synced || true

              ACTUAL=$(kubectl get secret smoke-test-secret -n "$NS" \
                -o go-template='{{ index .data "value" | base64decode }}' 2>/dev/null || true)

              if [ "$ACTUAL" = "$EXPECTED" ]; then
                echo "smoke-test-secret synced correctly from Vault via ClusterSecretStore/local-vault-backend"
                cleanup_ok
                exit 0
              else
                echo "smoke-test-secret did not sync the expected value in time (got: '$ACTUAL')."
                echo "Leaving namespace '$NS' and Vault path '$KV_PATH' in place for debugging."
                exit 1
              fi
