apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-presync-gate
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["vault.banzaicloud.com"]
    resources: ["vaults"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: external-secrets-presync-gate
    namespace: external-secrets
roleRef:
  kind: ClusterRole
  name: external-secrets-presync-gate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: external-secrets-presync-gate
  namespace: external-secrets
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: external-secrets-presync-gate
    spec:
      serviceAccountName: external-secrets-presync-gate
      restartPolicy: Never
      containers:
        - name: presync-gate
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              wait_for() {
                cond=$1
                shift
                retry kubectl get "$@"
                kubectl wait --for=condition="$cond" "$@" --timeout=300s
              }

              wait_for Established crd/clustersecretstores.external-secrets.io

              wait_for Available \
                deployment/external-secrets \
                deployment/external-secrets-webhook \
                deployment/external-secrets-cert-controller \
                -n external-secrets

              vault_has_leader() {
                [ -n "$(kubectl get vault vault -n vault \
                  -o jsonpath='{.status.leader}' 2>/dev/null)" ]
              }
              retry vault_has_leader

              echo "External Secrets is running and Vault has a leader"
