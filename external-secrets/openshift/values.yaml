# The upstream chart pins runAsUser: 1000, which restricted-v2 rejects; null
# deletes the key so the platform assigns a UID. See ./README.md#notes
external-secrets:
  replicaCount: 1
  podDisruptionBudget:
    enabled: false

  securityContext:
    runAsUser: null

  webhook:
    securityContext:
      runAsUser: null

  certController:
    securityContext:
      runAsUser: null
