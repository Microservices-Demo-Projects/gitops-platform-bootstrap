apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-presync-gate
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: cert-manager-presync-gate
    namespace: cert-manager
roleRef:
  kind: ClusterRole
  name: cert-manager-presync-gate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-presync-gate
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: cert-manager-presync-gate
    spec:
      serviceAccountName: cert-manager-presync-gate
      restartPolicy: Never
      containers:
        - name: presync-gate
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              wait_for() {
                cond=$1
                shift
                retry kubectl get "$@"
                kubectl wait --for=condition="$cond" "$@" --timeout=300s
              }

              wait_for Established \
                crd/clusterissuers.cert-manager.io \
                crd/certificates.cert-manager.io

              wait_for Available \
                deployment/cert-manager \
                deployment/cert-manager-webhook \
                deployment/cert-manager-cainjector \
                -n cert-manager

              cat <<'EOF' > /tmp/probe.yaml
              apiVersion: cert-manager.io/v1
              kind: ClusterIssuer
              metadata:
                name: presync-gate-admission-probe
              spec:
                selfSigned: {}
              EOF
              retry kubectl create --dry-run=server -f /tmp/probe.yaml

              echo "cert-manager is ready to admit and issue certificates"
