apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-smoke-test
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-smoke-test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: cert-manager-smoke-test
    namespace: cert-manager
roleRef:
  kind: ClusterRole
  name: cert-manager-smoke-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-smoke-test
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: cert-manager-smoke-test
    spec:
      serviceAccountName: cert-manager-smoke-test
      restartPolicy: Never
      containers:
        - name: smoke-test
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              kubectl create namespace test-certs \
                --dry-run=client -o yaml | kubectl apply -f -

              cat <<'EOF' > /tmp/example-cert.yaml
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: example-cert
                namespace: test-certs
              spec:
                secretName: example-cert-tls
                duration: 2160h # 90 days
                renewBefore: 240h # 10 days
                privateKey:
                  algorithm: RSA
                  size: 4096
                  rotationPolicy: Always
                commonName: "example.mydomain.com"
                dnsNames:
                  - "example.mydomain.com"
                  - "www.example.mydomain.com"
                subject:
                  organizationalUnits:
                  - "Demo Apps"
                  organizations:
                  - "Demo Apps"
                  countries:
                  - "CA"
                usages:
                  - server auth
                  - client auth
                  - digital signature
                  - key encipherment
                issuerRef:
                  name: demo-ca
                  kind: ClusterIssuer
                  group: cert-manager.io
              EOF

              retry kubectl apply -f /tmp/example-cert.yaml

              if kubectl wait --for=condition=Ready certificate/example-cert -n test-certs --timeout=300s; then
                echo "example-cert is Ready, cleaning up test-certs namespace"
                # --wait=false: this SA has no watch/list on namespaces.
                kubectl delete namespace test-certs --wait=false
                exit 0
              else
                echo "example-cert did not become Ready in time; leaving test-certs namespace for debugging"
                exit 1
              fi
