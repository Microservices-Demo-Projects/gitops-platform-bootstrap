headlamp:
  config:
    tlsCertPath: "/headlamp-cert/tls.crt"
    tlsKeyPath: "/headlamp-cert/tls.key"

  volumes:
    - name: headlamp-cert
      secret:
        secretName: headlamp-tls

  volumeMounts:
    - name: headlamp-cert
      mountPath: "/headlamp-cert"
      readOnly: true

  service:
    type: ClusterIP
    port: 443
    targetPort: 4466

  probes:
    scheme: HTTPS
