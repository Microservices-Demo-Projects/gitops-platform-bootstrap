apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-presync-gate
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["clusterissuers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-presync-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: postgres-presync-gate
    namespace: postgres
roleRef:
  kind: ClusterRole
  name: postgres-presync-gate
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-presync-gate
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      name: postgres-presync-gate
    spec:
      serviceAccountName: postgres-presync-gate
      restartPolicy: Never
      containers:
        - name: presync-gate
          image: docker.io/alpine/k8s:1.34.9
          env:
            - name: CNPG_OPERATOR_NAMESPACE
              value: cnpg-system
            - name: CNPG_OPERATOR_DEPLOYMENT
              value: cloudnative-pg-operator
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              wait_for() {
                cond=$1
                shift
                retry kubectl get "$@"
                kubectl wait --for=condition="$cond" "$@" --timeout=300s
              }

              wait_for Established crd/clusters.postgresql.cnpg.io
              wait_for Available "deployment/$CNPG_OPERATOR_DEPLOYMENT" -n "$CNPG_OPERATOR_NAMESPACE"

              wait_for Ready clusterissuer/demo-ca

              cat <<'EOF' > /tmp/probe.yaml
              apiVersion: cert-manager.io/v1
              kind: Certificate
              metadata:
                name: presync-gate-admission-probe
                namespace: postgres
              spec:
                secretName: presync-gate-admission-probe
                commonName: presync-gate-admission-probe
                dnsNames:
                  - presync-gate-admission-probe
                issuerRef:
                  name: demo-ca
                  kind: ClusterIssuer
                  group: cert-manager.io
              EOF
              retry kubectl create --dry-run=server -f /tmp/probe.yaml

              echo "CloudNativePG is ready for the Cluster, and demo-ca can issue its certificates"
