# Same assertions as ../../common/tests/base/smoke-test-job.yaml, but split across
# four images instead of apk-installing psql. See ../README.md#notes
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-smoke-test
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-smoke-test-pods
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-smoke-test-pods
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: postgres-smoke-test
    namespace: postgres
roleRef:
  kind: Role
  name: postgres-smoke-test-pods
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-smoke-test-vault-token
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["vault-unseal-keys"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-smoke-test-vault-token
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
subjects:
  - kind: ServiceAccount
    name: postgres-smoke-test
    namespace: postgres
roleRef:
  kind: Role
  name: postgres-smoke-test-vault-token
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-smoke-test
  namespace: postgres
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      name: postgres-smoke-test
    spec:
      serviceAccountName: postgres-smoke-test
      restartPolicy: Never
      initContainers:
        - name: fetch-vault-token
          image: docker.io/alpine/k8s:1.34.9
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              primary_exists() {
                [ -n "$(kubectl get pod -l cnpg.io/cluster=postgres,role=primary \
                  -n postgres -o name 2>/dev/null)" ]
              }
              retry primary_exists
              kubectl wait --for=condition=Ready pod \
                -l cnpg.io/cluster=postgres,role=primary \
                -n postgres --timeout=300s

              retry kubectl get secret vault-unseal-keys -n vault
              kubectl get secret vault-unseal-keys -n vault -o jsonpath='{.data.vault-root}' | base64 -d > /shared/vault-token
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: fetch-db-creds
          image: docker.io/hashicorp/vault:2.0.4
          env:
            - name: VAULT_ADDR
              value: https://vault.vault.svc.cluster.local:8200
            - name: VAULT_SKIP_VERIFY
              value: "true"
          command:
            - /bin/sh
            - -c
            - |
              set -e

              retry() {
                n=0
                until [ "$n" -ge 60 ]; do
                  "$@" && return 0
                  n=$((n + 1))
                  echo "waiting for: $* (attempt $n/60)"
                  sleep 5
                done
                echo "timed out waiting for: $*"
                return 1
              }

              export VAULT_TOKEN=$(cat /shared/vault-token)

              echo "Requesting a live dynamic lease from database/creds/app-ro ..."
              get_lease() {
                vault read -format=json database/creds/app-ro > /tmp/creds.json.tmp \
                  && mv /tmp/creds.json.tmp /tmp/creds.json
              }
              retry get_lease

              LEASE_ID=$(sed -n 's/.*"lease_id": *"\([^"]*\)".*/\1/p' /tmp/creds.json | head -1)
              DB_USER=$(sed -n 's/.*"username": *"\([^"]*\)".*/\1/p' /tmp/creds.json | head -1)
              DB_PASS=$(sed -n 's/.*"password": *"\([^"]*\)".*/\1/p' /tmp/creds.json | head -1)

              if [ -z "$LEASE_ID" ] || [ -z "$DB_USER" ] || [ -z "$DB_PASS" ]; then
                echo "Failed to parse a lease/username/password from Vault's response; leaving job for debugging."
                cat /tmp/creds.json
                exit 1
              fi
              echo "Got dynamic user: vlt_app_ro_$DB_USER (lease: $LEASE_ID)"

              printf '%s' "$LEASE_ID" > /shared/lease-id
              printf '%s' "vlt_app_ro_$DB_USER" > /shared/db-user
              printf '%s' "$DB_PASS" > /shared/db-pass
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: psql-check
          image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DB_USER=$(cat /shared/db-user)
              export PGPASSWORD=$(cat /shared/db-pass)

              echo "Connecting to postgres-rw.postgres.svc.cluster.local as $DB_USER and running SELECT 1 ..."
              if ! psql \
                  "host=postgres-rw.postgres.svc.cluster.local port=5432 dbname=pocdb user=$DB_USER sslmode=verify-full sslrootcert=/postgres-ca/ca.crt" \
                  -v ON_ERROR_STOP=1 -c "SELECT 1;"; then
                echo "psql connectivity check failed; leaving the lease and job for debugging."
                exit 1
              fi
              echo "Connectivity and role membership verified."
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: postgres-ca
              mountPath: /postgres-ca
              readOnly: true
      containers:
        - name: revoke-lease
          image: docker.io/hashicorp/vault:2.0.4
          env:
            - name: VAULT_ADDR
              value: https://vault.vault.svc.cluster.local:8200
            - name: VAULT_SKIP_VERIFY
              value: "true"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              export VAULT_TOKEN=$(cat /shared/vault-token)
              LEASE_ID=$(cat /shared/lease-id)

              echo "Revoking lease $LEASE_ID ..."
              vault lease revoke "$LEASE_ID"

              echo "Smoke test passed."
          volumeMounts:
            - name: shared
              mountPath: /shared
      volumes:
        - name: shared
          emptyDir: {}
        - name: postgres-ca
          secret:
            secretName: postgres-server-tls
